<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-App de Notas</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 40px auto; padding: 20px; }
        .input-contenedor { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; padding: 8px; }
        button { padding: 8px 12px; cursor: pointer; }
        li { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; padding: 8px; background: #f3f3f3; border-radius: 4px; }
        .btn-eliminar { background: #ff4d4d; color: white; border: none; border-radius: 3px; padding: 4px 8px; }
    </style>
</head>
<body>

    <h2>Mis Notas Personales</h2>
    <p>Escribe una nota importante y presiona agregar para guardarla.</p>

    <div class="input-contenedor">
        <input type="text" id="inputNota" placeholder="Escribe una nota aquí...">
        <button id="btnAgregar">Agregar</button>
    </div>

    <ul id="listaNotas"></ul>

    <script src="notas.js"></script>
</body>
</html>
